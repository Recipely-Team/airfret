name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Lint · Types · Tests · Structure · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run check:structure
      - run: npm run build

  songs:
    name: Real songs · audio against score and recording
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # A static ffmpeg from GitHub: the runner's apt mirror has hung this step for 25 minutes at a time.
      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          curl -sSfL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz | tar -xJ
          echo "$PWD/ffmpeg-master-latest-linux64-gpl/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: tools/songs/.cache
          key: song-references-07a927151e68
      - run: npm ci
      - run: npm run test:songs
