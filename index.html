<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Airfret</title>
    <meta name="description" content="Play guitar and bass in the air with your webcam." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0b0c'/%3E%3Cg stroke='%23e0a458' stroke-width='1.6'%3E%3Cpath d='M6 11h20M6 16h20M6 21h20'/%3E%3C/g%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app">
      <video id="cam" playsinline muted></video>
      <canvas id="stage"></canvas>

      <header class="bar">
        <a class="brand" href="/" data-link>Airfret</a>
        <button class="picker" id="menuBtn" type="button" aria-controls="nav" aria-expanded="false" aria-haspopup="true">
          <span class="picker-icon" id="pickerIcon"></span>
          <span class="picker-name" id="pageTitle"></span>
          <svg class="chevron" viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5 6 7.5 9 4.5"/></svg>
        </button>
        <button class="btn icon info-btn" id="infoBtn" type="button" data-i18n-label="info.open" hidden>
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="7.5"/><path d="M10 9v5"/><circle cx="10" cy="6.2" r="0.6" fill="currentColor" stroke="none"/></svg>
        </button>
        <div class="bar-context" id="barContext">
          <div class="seg" id="modes" role="radiogroup"></div>
          <select id="chordSet" class="select" data-i18n-label="ui.chordSet"></select>
          <button class="btn ghost" id="pedalsBtn" type="button" data-i18n="pedals.title" hidden></button>
          <div class="octaves" id="octaves" hidden>
            <button class="btn icon" id="octDown" type="button" data-i18n-label="piano.lower">◀</button>
            <span class="octave-range" id="octRange"></span>
            <button class="btn icon" id="octUp" type="button" data-i18n-label="piano.higher">▶</button>
          </div>
          <button class="select song-pick" id="demoSong" type="button" aria-haspopup="listbox" aria-expanded="false" hidden></button>
          <button class="btn ghost" id="demoBtn" type="button" aria-pressed="false" hidden></button>
          <button class="btn ghost ensemble-btn" id="ensembleBtn" type="button" aria-haspopup="listbox" aria-expanded="false" hidden></button>
        </div>
        <div class="spacer"></div>
        <nav class="learn-group" data-i18n-label="home.learn">
          <a class="learn-link" id="lessonsBtn" href="/lessons" data-link data-i18n-label="ui.lessons">
            <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5c2.4-1 4.8-1 7 .5 2.2-1.5 4.6-1.5 7-.5v11c-2.4-1-4.8-1-7 .5-2.2-1.5-4.6-1.5-7-.5z"/><path d="M10 5v11"/></svg>
            <span data-i18n="ui.lessons"></span>
          </a>
          <a class="learn-link" id="bandBtn" href="/band" data-link data-i18n-label="band.title">
            <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="14.5" r="2.3"/><circle cx="14" cy="13" r="2.3"/><path d="M8.3 14.5V5l8-1.6V13"/></svg>
            <span data-i18n="band.title"></span>
          </a>
          <a class="learn-link" id="exploreBtn" href="/explore" data-link data-i18n-label="explore.title">
            <svg viewBox="0 0 20 20" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7.2"/><path d="m12.8 7.2-1.6 4-4 1.6 1.6-4z"/></svg>
            <span data-i18n="explore.title"></span>
          </a>
        </nav>
        <span class="bar-divider" aria-hidden="true"></span>
        <button class="btn icon rec" id="recBtn" type="button" aria-pressed="false" data-i18n-label="rec.start" hidden>
          <svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.4"/><circle class="rec-dot" cx="10" cy="10" r="3.6" fill="currentColor"/></svg>
          <span class="rec-time" id="recTime" hidden></span>
        </button>
        <button class="btn icon" id="camPowerBtn" type="button" aria-pressed="false" data-i18n-label="ui.cameraOff">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><rect x="2.5" y="5.5" width="10.5" height="9" rx="1.6"/><path d="m13 8.6 4.5-2.4v7.6L13 11.4"/><path class="cam-slash" d="M3 3.5l14 13"/></svg>
        </button>
        <button class="btn icon" id="camBtn" type="button" aria-pressed="false" data-i18n-label="ui.hideCamera">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M2.5 6.5h3l1.5-2h6l1.5 2h3v9h-15z"/><circle cx="10" cy="11" r="2.8"/><path class="cam-slash" d="M3 3.5l14 13"/></svg>
        </button>
        <button class="btn icon" id="settingsBtn" type="button" data-i18n-label="ui.settings">
          <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="10" cy="10" r="2.6"/><path d="M10 1.8v2.4M10 15.8v2.4M1.8 10h2.4M15.8 10h2.4M4.2 4.2l1.7 1.7M14.1 14.1l1.7 1.7M4.2 15.8l1.7-1.7M14.1 5.9l1.7-1.7"/></svg>
        </button>
      </header>

      <div class="scrim" id="navScrim" hidden></div>
      <nav class="nav" id="nav" hidden></nav>

      <main class="home" id="home" hidden>
        <section class="hero">
          <h1 data-i18n="home.title"></h1>
          <p class="lead" data-i18n="home.lead"></p>
          <div class="hero-actions">
            <a class="btn primary hero-cta" href="/acoustic" data-link><span data-i18n="home.playNow"></span><small data-i18n="home.playNowHint"></small></a>
            <button class="btn ghost" id="homeTour" type="button" data-i18n="home.tourCta"></button>
          </div>
        </section>
        <div id="homeInstruments"></div>
        <h2 class="home-label" data-i18n="home.learn"></h2>
        <div class="learn-row" id="homeLearn"></div>
        <div class="home-foot">
          <p class="muted small home-privacy" data-i18n="app.privacy"></p>
          <div class="seg small lang-switch" role="radiogroup" data-i18n-label="ui.language"></div>
        </div>
      </main>

      <div class="lesson-bar" id="lessonBar" hidden>
        <div class="lesson-title" id="lessonTitle"></div>
        <div class="progress"><div id="lessonProgress"></div></div>
        <div class="stat"><span id="lessonAcc">0%</span></div>
        <div class="stat"><span id="lessonStreak">0</span>×</div>
        <label class="mix" id="mixGuide"><span data-i18n="mix.guide"></span><input type="range" id="guideVolume" min="0" max="1" step="0.01" /></label>
        <label class="mix"><span data-i18n="mix.me"></span><input type="range" id="playerVolume" min="0" max="1" step="0.01" /></label>
        <button class="btn ghost" id="lessonStop" data-i18n="lesson.stop"></button>
      </div>

      <div class="popover" id="settings" hidden>
        <label class="row"><span data-i18n="ui.lefty"></span><input type="checkbox" id="lefty" /></label>
        <div class="row"><span data-i18n="ui.strumFilter"></span><div class="seg small" id="strumFilter"></div></div>
        <label class="row" id="voiceRow"><span data-i18n="ui.voice"></span><select id="voice" class="select"></select></label>
        <label class="row"><span data-i18n="ui.tuning"></span><select id="tuning" class="select"></select></label>
        <label class="row col"><span><span data-i18n="ui.capo"></span> <em id="capoVal"></em></span><input type="range" id="capo" min="0" max="7" step="1" /></label>
        <label class="row col"><span data-i18n="ui.volume"></span><input type="range" id="volume" min="0" max="1" step="0.01" /></label>
        <label class="row col"><span data-i18n="ui.camera"></span><input type="range" id="brightness" min="0.15" max="1" step="0.01" /></label>
        <label class="row col"><span><span data-i18n="ui.latency"></span> <em id="latencyVal"></em></span><input type="range" id="latency" min="0" max="200" step="5" /></label>
        <div class="row"><span data-i18n="ui.language"></span><div class="seg small" id="langs"></div></div>
      </div>

      <div class="popover pedals" id="pedals" hidden>
        <div class="drawer-head flat"><h3 data-i18n="pedals.title"></h3><button class="btn ghost" id="pedalsClose" data-i18n="ui.close"></button></div>
        <p class="muted small" data-i18n="pedals.about"></p>
        <div id="pedalsList"></div>
        <div class="row"><span data-i18n="pedals.hihatMode"></span><div class="seg small" id="pedalsHat"></div></div>
        <p class="status small" id="pedalsStatus"></p>
        <div class="actions left">
          <button class="btn small" id="pedalsMidi" data-i18n="pedals.midi"></button>
          <button class="btn small ghost" id="pedalsReset" data-i18n="pedals.reset"></button>
        </div>
      </div>

      <section class="band" id="band" hidden>
        <div class="band-head">
          <h2 data-i18n="band.title"></h2>
          <label class="band-song"><span class="sr-only" data-i18n="band.song"></span><select id="bandSong" class="select"></select></label>
          <button class="btn primary" id="bandPlay" type="button" aria-pressed="false"></button>
          <label class="band-song"><span class="muted small" data-i18n="band.style"></span><select id="bandStyle" class="select"></select></label>
          <label class="band-song"><span class="muted small" data-i18n="band.energy"></span><select id="bandEnergy" class="select"></select></label>
          <label class="band-song"><span class="muted small" data-i18n="band.harmony"></span><select id="bandHarmony" class="select"></select></label>
          <span class="muted small band-section" id="bandSection" aria-live="polite"></span>
          <div class="spacer"></div>
          <button class="btn ghost" id="bandClose" type="button" data-i18n="ui.close"></button>
        </div>
        <div class="band-grid" id="bandGrid" role="group" data-i18n-label="band.members"></div>
        <div class="band-sheet" id="bandPicker" hidden>
          <div class="band-sheet-card" role="dialog" aria-modal="true" data-i18n-label="band.add">
            <div class="band-sheet-head"><h3 data-i18n="band.add"></h3><span class="muted small" id="bandPickerNote"></span><div class="spacer"></div><button class="btn primary" id="bandPickerDone" type="button" data-i18n="band.done"></button></div>
            <div class="band-sheet-list" id="bandPickerList"></div>
          </div>
        </div>
      </section>

      <div class="overlay" id="explore" hidden>
        <div class="card explore">
          <div class="drawer-head flat"><h2 data-i18n="explore.title"></h2><button class="btn ghost" id="exploreClose" data-i18n="ui.close"></button></div>
          <p class="muted" data-i18n="explore.intro"></p>
          <div class="explore-grid" id="exploreGrid"></div>
        </div>
      </div>

      <div class="popover help" id="help" hidden>
        <ol>
          <li data-i18n="help.1"></li>
          <li data-i18n="help.2"></li>
          <li data-i18n="help.3"></li>
          <li data-i18n="help.4"></li>
        </ol>
        <p class="muted" data-i18n="app.mouseHint"></p>
      </div>

      <aside class="drawer" id="lessons" hidden>
        <div class="drawer-head">
          <h2 data-i18n="lesson.title"></h2>
          <button class="btn ghost" id="lessonsClose" data-i18n="ui.close"></button>
        </div>
        <input type="search" class="search" id="songSearch" autocomplete="off" spellcheck="false" data-i18n-label="lesson.search" />
        <div class="song-list" id="songList"></div>
        <div class="lesson-opts">
          <button class="btn wide" id="customBtn" data-i18n="custom.add"></button>
          <button class="btn wide ghost" id="tourBtn" data-i18n="tour.start"></button>
        </div>
      </aside>

      <div class="overlay" id="start">
        <div class="card">
          <div class="brand big"><span class="mark"></span>Airfret</div>
          <p class="lead" data-i18n="app.tagline"></p>
          <ol class="steps">
            <li data-i18n="help.1"></li>
            <li data-i18n="help.2"></li>
            <li data-i18n="help.4"></li>
          </ol>
          <button class="btn primary wide" id="startBtn" data-i18n="app.start"></button>
          <p class="status" id="startStatus"></p>
          <div class="seg small lang-switch start-lang" role="radiogroup" data-i18n-label="ui.language"></div>
          <p class="muted small" data-i18n="app.noCameraStart"></p>
          <p class="muted small" data-i18n="app.privacy"></p>
        </div>
      </div>

      <div class="overlay" id="info" hidden>
        <article class="card info" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
          <header class="info-head">
            <div class="info-icon" id="infoIcon" aria-hidden="true"></div>
            <div class="info-names">
              <p class="eyebrow" id="infoFamily"></p>
              <h2 id="infoTitle"></h2>
              <p class="info-origin" id="infoOrigin"></p>
            </div>
            <button class="btn icon info-close" id="infoClose" type="button" data-i18n-label="ui.close">
              <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg>
            </button>
          </header>
          <p class="info-history" id="infoHistory"></p>
          <h3 class="info-label" data-i18n="info.timeline"></h3>
          <ol class="timeline" id="infoTimeline"></ol>
          <dl class="info-facts" id="infoFacts"></dl>
        </article>
      </div>
      <div class="overlay" id="intro" hidden>
        <div class="card intro">
          <p class="eyebrow" id="introEyebrow"></p>
          <h2 id="introTitle"></h2>
          <p class="muted" id="introAbout"></p>
          <div class="intro-chords" id="introChords"></div>
          <ul class="intro-tips" id="introTips"></ul>
          <div class="mode-cards" id="introModes" role="radiogroup"></div>
          <div class="intro-row">
            <div class="opt"><span data-i18n="lesson.tempo"></span><div class="seg small" id="introTempo"></div></div>
            <label class="opt"><span data-i18n="lesson.drums"></span><input type="checkbox" id="introDrums" /></label>
          </div>
          <div class="actions">
            <button class="btn" id="introBack" data-i18n="lesson.back"></button>
            <button class="btn" id="introWatch" type="button" data-i18n="demo.play"></button>
            <button class="btn primary" id="introStart" data-i18n="lesson.start"></button>
          </div>
        </div>
      </div>

      <div class="tour-bar" id="tourBar" hidden>
        <button class="btn ghost" id="tourSkip" data-i18n="tour.skip"></button>
        <button class="btn ghost" id="tourExit" data-i18n="tour.exit"></button>
      </div>

      <div class="overlay" id="custom" hidden>
        <form class="card intro" id="customForm">
          <p class="eyebrow" data-i18n="custom.eyebrow"></p>
          <h2 data-i18n="custom.title"></h2>
          <p class="muted" data-i18n="custom.about"></p>
          <label class="field"><span data-i18n="custom.name"></span><input id="customTitle" maxlength="60" required /></label>
          <label class="field"><span data-i18n="custom.chords"></span><textarea id="customChords" rows="5" spellcheck="false" placeholder="G D Em C  |  G:2 D:2 Em C  |  G4:1 A4:0.5 B4:0.5 r:1"></textarea></label>
          <p class="muted small" data-i18n="custom.chordsHelp"></p>
          <div class="file-row"><label class="btn ghost file-btn"><input type="file" id="customFile" hidden /><span data-i18n="custom.openFile"></span></label><span class="muted small" data-i18n="custom.fileHelp"></span></div>
          <div class="intro-row">
            <label class="field small"><span>BPM</span><input id="customBpm" type="number" min="40" max="220" value="90" /></label>
            <div class="opt"><span data-i18n="custom.meter"></span><div class="seg small" id="customMeter"></div></div>
            <div class="opt"><span data-i18n="custom.rhythm"></span><div class="seg small" id="customRhythm"></div></div>
          </div>
          <p class="status" id="customError"></p>
          <div class="actions">
            <button class="btn" type="button" id="customCancel" data-i18n="ui.close"></button>
            <button class="btn primary" type="submit" data-i18n="custom.save"></button>
          </div>
        </form>
      </div>

      <div class="overlay" id="result" hidden>
        <div class="card">
          <p class="eyebrow" data-i18n="lesson.done"></p>
          <h2 id="resultTitle"></h2>
          <div class="big-num" id="resultAcc"></div>
          <p class="muted" id="resultCounts"></p>
          <p class="muted" id="resultStreak"></p>
          <div class="actions">
            <button class="btn" id="resultBack" data-i18n="lesson.back"></button>
            <button class="btn primary" id="resultAgain" data-i18n="lesson.again"></button>
          </div>
        </div>
      </div>

      <div class="overlay" id="clip" hidden>
        <div class="card clip-card">
          <p class="eyebrow" data-i18n="clip.title"></p>
          <video class="clip-video" id="clipVideo" controls playsinline></video>
          <p class="muted small" id="clipInfo"></p>
          <p class="muted small" data-i18n="clip.privacy"></p>
          <div class="actions">
            <button class="btn" id="clipDiscard" type="button" data-i18n="clip.discard"></button>
            <a class="btn primary" id="clipSave" data-i18n="clip.save"></a>
          </div>
        </div>
      </div>

      <div class="popover song-picker ensemble-picker" id="ensemblePicker" hidden><div class="song-picker-list" id="ensembleList"></div></div>
      <div class="popover song-picker" id="songPicker" hidden>
        <input type="search" class="search" id="songPickerSearch" autocomplete="off" spellcheck="false" data-i18n-label="lesson.search" />
        <div class="song-picker-list" id="songPickerList" role="listbox"></div>
      </div>

      <div class="toast" id="toast" hidden></div>
      <div class="build-tag" id="buildTag" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/presentation/bootstrap/main.ts"></script>
  </body>
</html>
